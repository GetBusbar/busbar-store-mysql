# RENDERED by `cargo xtask fleet render busbar-store-mysql` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. The CI itself is
# busbar's plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref).
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@0db7ee2ea048217ea3fc10f0d92fbda19ee1f133
    with:
      service: mysql
      busbar_checkout: true
      macos_test: "env -u CI cargo test --locked -p busbar-store-mysql-plugin --test conformance"
      extra_test: ""
      plugin_crate: busbar-store-mysql-plugin
      plugin_kind: store
      plugin_alias: mysql
    secrets: inherit
