# RENDERED by `busbar-release plugin heal busbar-store-mysql` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Weekly: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "3 9 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@1d111f29049842e66f4ce3419e1219302a249b4f
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-store-mysql
      plugin_name: busbar-store-mysql
      plugin_alias: mysql
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
