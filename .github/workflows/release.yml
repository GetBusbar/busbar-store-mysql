# RENDERED by `cargo xtask fleet render busbar-store-mysql` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    tags: ["v*", "!v*-*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@23d8a6b46deb158839df8bc02115b09023633040
    with:
      service: mysql
      busbar_checkout: true
      macos_test: "env -u CI cargo test --locked -p busbar-store-mysql-plugin --test conformance"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@23d8a6b46deb158839df8bc02115b09023633040
    with:
      plugin_crate: busbar-store-mysql-plugin
      manifest_name: busbar-store-mysql
      plugin_alias: mysql
      plugin_kind: store
      asset_prefix: busbar-store-mysql
      description: "First-party signed kind:store plugin cdylib: the MySQL/MariaDB backend for busbar's durable governance store, exported over the store C ABI. Drop the built library into the plugins folder and set store.module: mysql to share virtual keys, budgets, and usage across a fleet of busbar nodes."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "store-mysql/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@23d8a6b46deb158839df8bc02115b09023633040
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-store-mysql
      plugin_name: busbar-store-mysql
      plugin_alias: mysql
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
