# SPDX-License-Identifier: Apache-2.0
#
# RENDERED by `cargo xtask fleet render busbar-store-mysql` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/workspace-Cargo.toml; `cargo xtask fleet check` is red on any edit here.
#
# One repo per plugin, every repo a twin: this workspace is exactly two crates, the logic
# (`store-mysql/`, the rlib a busbar build can link) and the thin cdylib that packages it as a
# droppable `kind: store` plugin (`store-mysql-plugin/`, crate `busbar-store-mysql-plugin`). Its busbar
# dependencies are git dependencies on GetBusbar/busbar at the fleet pin (`.busbar-ref` field 1);
# no sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "store-mysql",
    "store-mysql-plugin",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/busbar-store-mysql"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "0db7ee2ea048217ea3fc10f0d92fbda19ee1f133" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "0db7ee2ea048217ea3fc10f0d92fbda19ee1f133" }
