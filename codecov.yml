# Codecov is INFORMATIONAL here, never a gate. The correctness gate is the `ci` reusable workflow;
# coverage is an observation surfaced on the README badge and as per-PR context. So:
#   * status.*.informational: true  → Codecov posts a check for visibility but it is NEVER "failing",
#     so it can never block a PR or turn a branch red over a coverage delta.
#   * comment: false                → no bot comments on PRs; the signal lives on the badge + the
#     Codecov UI, keeping PRs seamless.
#   * ignore                        → exclude test-only paths so the reported percentage reflects the
#     shipped plugin code, not the roundtrip/integration test harnesses.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "**/tests"
  - "store-mysql/tests"
  - "store-mysql-plugin/tests"
