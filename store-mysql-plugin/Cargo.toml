# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-mysql-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:store plugin cdylib: the MySQL/MariaDB backend for busbar's durable governance store, exported over the store C ABI. Drop the built library into the plugins folder and set store.module: mysql to share virtual keys, budgets, and usage across a fleet of busbar nodes."
license = "Apache-2.0"

[lib]
# cdylib for the C ABI delivery (all the SQL/logic lives in busbar-store-mysql); rlib matches the
# sibling plugins' convention (store-postgres-plugin, auth-oidc-plugin, webrequest-hook) and is
# REQUIRED for `cargo test` to actually emit the cdylib artifact at all — with cdylib-only, `cargo
# test --workspace` builds a trivial "0 tests" harness for this package but never produces the
# .so/.dylib, so an e2e test's own dlopen of its "real built cdylib" silently finds nothing (the
# exact bug store-postgres-plugin's own Cargo.toml documents hitting and fixing the same way).
crate-type = ["cdylib", "rlib"]

[features]
# THE DROPPED-IN DOOR: `export_door!` emits the one C symbol `busbar_plugin_door`, and ONLY the
# dropped-in cdylib may export it (compiled in = dropped in, one table: a busbar build that links
# this crate as a row, alone or beside others, must carry no door symbol, or two doors in one
# binary multiply define it under `lto = "fat"`). OFF by default; the dropped-in artifact is built
# `cargo build --release -p busbar-store-mysql-plugin --features dropped-in`, and `cargo test` names this crate
# below with it on so the cdylib the conformance test opens carries the door.
dropped-in = []

[dependencies]
# THE STORE, same repo. Its `store_door!` is the store's door; this crate only exports that door
# as a loadable library.
busbar-store-mysql = { path = "../store-mysql" }
# `export_door!`. Same pinned rev as the logic crate's, so one busbar source resolves.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }

[dev-dependencies]
# The conformance test opens this crate's own cdylib WITH its dropped-in door on (see `[features]`).
busbar-store-mysql-plugin = { path = ".", features = ["dropped-in"] }
# The conformance and end-to-end tests load the built cdylib over the REAL loader (sign, pack, scan,
# open) and the linked row through the same registry — dev-only, never in the shipped artifact. Same
# pinned rev as the logic crate's busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }
serde_json = "1"
# Drives the store v3 slots (`StoreCalls`, async) to completion on a current-thread runtime.
tokio = { version = "1", features = ["rt"] }
mysql = { version = "26", default-features = false, features = ["minimal"] }
# For admin_api_e2e.rs: drives the real busbar admin HTTP API (install/mint) against an
# OUT-OF-PROCESS busbar, fully synchronous (no tokio runtime — matches store-postgres-plugin's own
# admin_api_e2e.rs rationale for `reqwest::blocking`).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
base64 = "0.22"
