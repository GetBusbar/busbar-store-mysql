# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-mysql"
version = "1.0.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The MySQL/MariaDB backend for busbar's durable governance store — the shared, multi-node db plugin. Implements busbar_contract::records::RecordStore over a mutex-guarded sync mysql client."
license = "Apache-2.0"

[lib]
# rlib: THE LOGIC, and the store's one door registration (`export_store_plugin!(open)`, its
# `linked::STORE` row and `BUSBAR_COLD_ENTRY`). The sibling `busbar-store-mysql-plugin` cdylib
# re-exports it as the dropped-in door. One source, both doors (DECISIONS #2 rule (1)).
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "23d8a6b46deb158839df8bc02115b09023633040" }
mysql = { version = "26", default-features = false, features = ["minimal"] }
serde_json = "1"
ulid = "1"

[dev-dependencies]
# The `Store` contract conformance suite used to arrive here as `busbar-plugin-testkit`; the owner
# ruled that crate DELETED on 2026-09-22 and #2/#31 forbid a shared test util between plugins, so
# this crate owns its copy at `src/tests/store_conformance.rs`. Its plane-record battery serializes
# throwaway stand-in rows into the opaque bodies it writes, which is the one thing it needs beyond
# `busbar-contract` (a normal dependency above) and `serde_json`.
serde = { version = "1", features = ["derive"] }
