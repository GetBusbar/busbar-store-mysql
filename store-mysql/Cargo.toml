# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-mysql"
version = "1.0.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The MySQL/MariaDB backend for busbar's durable governance store — the shared, multi-node db plugin. Serves the store v3 door over the host's connector (no socket of its own): the MySQL client protocol over kept connections."
license = "Apache-2.0"

[lib]
# rlib: THE LOGIC, and the store's door (`store_door!` over its `StoreSlots`: `door`, the row a
# busbar build that links this crate registers). The sibling `busbar-store-mysql-plugin` cdylib
# exports the same `door` as the dropped-in door. One source, both doors (DECISIONS #2 rule (1)).
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`.
busbar-contract = { workspace = true }
# THE MYSQL CLIENT PROTOCOL WITHOUT A SOCKET (busbar THE DESIGN, the connections section: the store
# reaches its server only over the host's connector, ARCHITECT rulings 2026-10-03 on Q-L14-1 /
# Q-L16-2): `mysql_common` is the sans-IO core the 1.5.5 `mysql` driver is built on (packets, the
# handshake, mysql_native_password / caching_sha2_password, `Value`/`Row`/`FromRow`, `params!`), so
# every parameter and column converts exactly as it did over the driver. `src/mysqlwire.rs` is the
# driver's connection logic, every byte over the op's wire.
mysql_common = { workspace = true }
# The compressed protocol's deflate (`compress=` in the URL), pure Rust (busbar's own flate2 row).
flate2 = { workspace = true }
bytes = { workspace = true }
# The 1.5.5 driver's URL reading (`mysql://...`): pure parsing, no socket.
url = { workspace = true }
percent-encoding = { workspace = true }
serde_json = { workspace = true }
[dev-dependencies]
# The `Store` contract conformance suite used to arrive here as `busbar-plugin-testkit`; the owner
# ruled that crate DELETED on 2026-09-22 and #2/#31 forbid a shared test util between plugins, so
# this crate owns its copy at `src/tests/store_conformance.rs`. Its plane-record battery serializes
# throwaway stand-in rows into the opaque bodies it writes, which is the one thing it needs beyond
# `busbar-contract` (a normal dependency above) and `serde_json`.
serde = { workspace = true }
ulid = { workspace = true }
# The live tests open the store the way the host does: its door through the REAL loader on a
# dispatcher (`load_linked`, `LoadedStore`), every connection over the loader's test connection table
# (`TcpConns`, `test-support`). The 1.5.5 `mysql` driver verifies what landed INDEPENDENTLY of the
# store (tests only; never in the shipped image).
busbar-plugin-loader = { workspace = true, features = ["test-support"] }
mysql = { workspace = true }
